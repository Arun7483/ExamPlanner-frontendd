<div class="layout-wrapper">
  <header class="header">
    <div class="left-header">
      <label class="title">Student Portal</label>
    </div>

    <div class="action_buttons">
      <p-button 
        icon="pi pi-user" 
        label="User" 
        [text]="true" 
        styleClass="user_profile_button" 
        (onClick)="toggleProfilePage()">
      </p-button>

      <p-button 
        icon="pi pi-sign-out" 
        label="Log Out" 
        [text]="true" 
        styleClass="logout_button" 
        (click)="logout()">
      </p-button>
    </div>
  </header>

  <main class="page-body">
    <div class="welcome-section">
      <div class="welcome-content">
        <div class="welcome-text">
          <h1>Welcome back!</h1>
          <p>Access your exam schedule and academic resources below.</p>
        </div>
        <button class="btn-download-welcome" (click)="downloadAdmit()">
          <i class="pi pi-file-pdf"></i> Download Admit Card
        </button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Registered Exams</span>
        <div class="stat-value">{{ exams.length }}</div>
      </div>

      <div class="stat-card">
        <span class="stat-label">Upcoming Exams</span>
        <div class="stat-value">3</div> 
      </div>
    </div>

    <div class="content-body">
      <h2>Exam Schedule</h2>
      <div class="table-container">
        <table class="exam-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Course Name</th>
              <th>Date</th>
              <th>Venue</th>
              <th>Seat</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let exam of exams">
              <td style="font-weight: 700; color: #3b82f6;">{{ exam.code }}</td>
              <td>{{ exam.name }}</td>
              <td>{{ exam.date }}</td>
              <td>{{ exam.venue }}</td>
              <td><span class="status-badge">{{ exam.seat }}</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <p-drawer [(visible)]="profilePageVisible" position="right" [modal]="true" header="Profile">
    <app-profile-card></app-profile-card>
  </p-drawer>
</div>
