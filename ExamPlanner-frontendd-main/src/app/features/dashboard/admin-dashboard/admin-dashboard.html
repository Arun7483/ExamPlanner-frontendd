<div class="layout-wrapper">
    <header class="header">
            <div class="left-header">
                <p-button icon="pi pi-bars" (onClick)="toggleSideBar()" styleClass="mobile-menu-btn" [text]="true" [rounded]="true"/>
                <label class="title">Admin Dashboard</label>
            </div>
            <div class="action_buttons">
                <p-button icon="pi pi-user" [rounded]="true" label="User" [text]="true" styleClass="user_profile_button" (onClick)="toggleProfilePage()"/>
                <p-button icon="pi pi-sign-out" [rounded]="true" label= "Log Out" [text]="true" styleClass="logout_button" (click)="AdminLogout()"/>
            </div>
        </header>
    <div class="lower-container">
        <aside class="desktop-sidebar">
            <ng-container *ngTemplateOutlet="menuContent"></ng-container>
        </aside>
        <main class="page-body">
            <router-outlet></router-outlet>
        </main>

    </div>

    
    <p-drawer [(visible)]="sidebarVisible" position="left" [modal]="true">
        <ng-container *ngTemplateOutlet="menuContent"></ng-container>
    </p-drawer>
    <p-drawer [(visible)]="profilePageVisible" position="right" [modal]="true">
        <ng-container *ngTemplateOutlet="profilepage"></ng-container>
    </p-drawer>
</div>

<ng-template #menuContent>
    <nav class="sidebar-nav">
        <p-button label="Home" icon="pi pi-home" [text]="true" styleClass="nav-link" (onClick)="closeSideBar()" [routerLink]="['home']"/>
        <p-button label="Departments" icon="pi pi-building" [text]="true" styleClass="nav-link" (onClick)="closeSideBar()" [routerLink]="['department']"/>
        <p-button label="Courses" icon="pi pi-book" [text]="true" styleClass="nav-link" (onClick)="closeSideBar()" [routerLink]="['courses']"/>
        <p-button label="Students" icon="pi pi-users" [text]="true" styleClass="nav-link" (onClick)="closeSideBar()" [routerLink]="['students']"/>
        <p-button label="Invigilators" icon="pi pi-eye" [text]="true" styleClass="nav-link" (onClick)="closeSideBar()" [routerLink]="['invigilator']"/>
        <p-button label="Exam Schedules" icon="pi pi-calendar" [text]="true" styleClass="nav-link" (onClick)="closeSideBar()" [routerLink]="['schedules']"/>
        <p-button label="Hall Allocation" icon="pi pi-map-marker" [text]="true" styleClass="nav-link" (onClick)="closeSideBar()" [routerLink]="['halls']"/> 
        <p-button label="Analytics & Reports" icon="pi pi-chart-bar" [text]="true" styleClass="nav-link" (onClick)="closeSideBar()" [routerLink]="['analytics']"/>
    </nav>
</ng-template>
