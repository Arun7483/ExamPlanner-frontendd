services:

  # =====================================================
  # BACKEND - SPRING BOOT
  # =====================================================

  - type: web
    name: examplanner-api
    runtime: docker
    rootDir: Backend-ExamPlanner-main/Backend-ExamPlanner-main
    healthCheckPath: /api/health

    envVars:
      - key: PORT
        value: 10000

      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: DATABASE_URL
        sync: false

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRATION
        value: 86400000

      - key: CORS_ALLOWED_ORIGIN
        sync: false

  # =====================================================
  # FRONTEND - ANGULAR
  # =====================================================

  - type: web
    name: examplanner-frontend
    runtime: static
    rootDir: ExamPlanner-frontendd-main/ExamPlanner-frontendd-main

    buildCommand: npm install && node -e "const fs=require('fs'); const p='src/index.html'; let s=fs.readFileSync(p,'utf8'); s=s.replace('__API_URL__', process.env.API_URL || 'http://localhost:8090'); fs.writeFileSync(p,s);" && npm run build

    staticPublishPath: ./dist/ExamPlanner/browser

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: API_URL
        sync: false
