services:
  - type: web
    name: examplanner-backend
    runtime: docker
    dockerfilePath: ./Backend-ExamPlanner-main/Dockerfile
    dockerContext: ./Backend-ExamPlanner-main
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGIN
        value: https://examplannerr.onrender.com

  - type: web
    name: examplannerr
    runtime: static
    rootDir: ./ExamPlanner-frontendd-main
    buildCommand: npm install && npm run build && sed -i "s|__API_URL__|$API_URL|g" dist/ExamPlanner/browser/index.html
    staticPublishPath: ./ExamPlanner-frontendd-main/dist/ExamPlanner/browser
    envVars:
      - key: API_URL
        value: https://examplanner-backend.onrender.com
